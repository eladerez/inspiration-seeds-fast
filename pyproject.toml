[project]
name = "inspiration-seeds-fast"
version = "0.1.0"
description = "How much faster can Inspiration Seeds run before it loses creative, diverse blends?"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "pillow",
    "pyarrow",
    "pyyaml",
    "google-cloud-storage",
]

[dependency-groups]
# GPU VM only: generation.
gen = [
    "torch==2.9.*",
    "diffusers==0.42.0",
    "transformers",
    "peft",
    "accelerate",
    "sentencepiece",
    "protobuf",
    "huggingface_hub",
    "torchao==0.16.0",
]
# Laptop / end of GPU job: scoring.
eval = [
    "dreamsim",
    "google-genai",
]
dev = ["pytest"]
# Configs 3, 4, 8 (VM only, x86_64): prebuilt wheel matching torch 2.9 + CUDA 12.8.
nunchaku = [
    "nunchaku @ https://github.com/nunchaku-tech/nunchaku/releases/download/v1.2.1/nunchaku-1.2.1%2Bcu12.8torch2.9-cp311-cp311-linux_x86_64.whl ; platform_machine == 'x86_64'",
]

[tool.uv]
default-groups = ["dev"]

# On the x86_64 VM, torch comes from the CUDA 12.8 index (Blackwell needs CUDA >= 12.8); elsewhere from PyPI.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu128", marker = "platform_machine == 'x86_64'" }]
[tool.pytest.ini_options]
pythonpath = ["."]
